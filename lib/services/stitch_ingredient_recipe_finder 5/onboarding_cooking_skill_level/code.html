<!-- Beginner Option -->

</div>
<div class="flex-grow">
<h3 class="font-title-card text-title-card text-on-surface mb-1">Beginner</h3>

</div>
<div class="check-icon opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Intermediate Option -->

</div>
<div class="flex-grow">
<h3 class="font-title-card text-title-card text-on-surface mb-1">Intermediate</h3>
<p class="text-sm text-on-surface-variant">Comfortable with most recipes</p>
</div>
<div class="check-icon opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Pro Option -->
<button class="skill-card group w-full text-left bg-surface border border-outline-variant p-grid-gap rounded-xl transition-all duration-200 hover:shadow-md flex items-center gap-grid-gap relative overflow-hidden" id="skill-pro" onclick="selectSkill('pro')">
<div class="flex-shrink-0 w-16 h-16 bg-primary-container/10 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="restaurant_menu">restaurant_menu</span>
</div>

</div>
<div class="check-icon opacity-0 transition-opacity">

</main>
<script>
    function selectSkill(skill) {
      // Remove active classes from all cards
      const cards = document.querySelectorAll('.skill-card');
      cards.forEach(card => {
        card.classList.remove('active', 'ring-4', 'ring-primary-container', 'bg-surface-container', 'border-transparent');
        card.classList.add('bg-surface', 'border-outline-variant');
        const iconContainer = card.querySelector('.check-icon');
        iconContainer.classList.add('opacity-0');
        iconContainer.classList.remove('opacity-100');
      });

      // Add active class to selected card
      const activeCard = document.getElementById(`skill-${skill}`);
      activeCard.classList.add('active', 'ring-4', 'ring-primary-container', 'bg-surface-container', 'border-transparent');
      activeCard.classList.remove('bg-surface', 'border-outline-variant');
      const activeIcon = activeCard.querySelector('.check-icon');
      activeIcon.classList.remove('opacity-0');
      activeIcon.classList.add('opacity-100');

      // Add a small scale animation
      activeCard.style.transform = 'scale(0.98)';
      setTimeout(() => {
        activeCard.style.transform = 'scale(1)';
      }, 100);
    }
  </script>
