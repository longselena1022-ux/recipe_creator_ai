</button>
<h1 class="font-display-hero text-title-card text-primary dark:text-primary-fixed-dim">PantryChef</h1>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex-grow pt-24 pb-32 px-container-padding max-w-4xl mx-auto w-full">

</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">

<h2 class="font-headline-section text-headline-section text-on-surface mb-3">What's in your kitchen?</h2>
<p class="font-body-large text-on-surface-variant max-w-xl">
                Select the tools you have so we can suggest recipes you can actually make without a trip to the store.
            </p>
</section>
<!-- Bento Grid Selection -->
<section class="bento-grid" id="equipment-grid">

</div>
<div class="w-16 h-16 bg-primary-container/10 rounded-xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="airfryer">airlines</span>
</div>
<span class="font-title-card text-label-caps text-center">Air Fryer</span>
</button>

</div>

<img class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay" data-alt="A high-end modern kitchen space featuring clean marble countertops and professional-grade stainless steel appliances. The lighting is bright and airy, reflecting a morning sunlit atmosphere. The color palette is composed of cool greys, crisp whites, and deep navy blue accents, perfectly aligning with a premium bento-style culinary design system. The mood is organized, professional, and inspiring for a home chef." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuSiMSTnLswdsiIQsm7CymGUk0v7r8GSDUcfYUENgdR7nLW8fLQor1hgaJyxY-4J1LR6cslkx_jEBX3Nt84u0FT6rQmaKDi-9V5XIbILlCkqp_nHllrjxZpDwIgagBt3emUZm0-3Uo16X1UQPN6aQzAe6NaSa8aN8VtetYCsyQlKHaChs1TPLBaZhGT7gGk-Hi3q_jv00cmeqmR-Pahfr_uYgU0r6Xuk4VBF00QuMaQ0IDfFZx9rgEkV_0KdCHfD6QDFRrWnvzeMYh"/>
<div class="relative z-10 max-w-sm">
<h3 class="font-title-card text-headline-section mb-2">Equipped for Success</h3>

</section>
</main>
<!-- Action Bar (Sticky Bottom) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant py-6 px-container-padding z-50">
<div class="max-w-4xl mx-auto flex gap-4">
<button class="flex-1 py-4 border border-outline text-on-surface font-title-card rounded-xl hover:bg-surface-container transition-colors active:scale-95 duration-150">
                Back
            </button>
<button class="flex-[2] py-4 bg-secondary-container text-on-secondary-container font-title-card rounded-xl hover:opacity-90 transition-opacity active:scale-95 duration-150 shadow-md">
                Finish Setup
            </button>
</div>
</footer>
<script>
        function toggleSelection(element) {
            element.classList.toggle('selected');
            const icon = element.querySelector('.material-symbols-outlined');
            // Adding a little bounce effect on click
            element.style.transform = 'scale(0.95)';
            setTimeout(() => {
                element.style.transform = '';
            }, 100);
        }

        // Initialize with a few default items selected for visual pop
        window.onload = () => {
            const cards = document.querySelectorAll('.equipment-card');
            if(cards.length > 3) {
                cards[3].classList.add('selected'); // Cast Iron
                cards[5].classList.add('selected'); // Oven
            }
        };
    </script>
