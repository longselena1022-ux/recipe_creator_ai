<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card-hover:hover {
            transform: translateY(-4px);
        }
        .selection-active {
            border-color: #064774 !important;
            background-color: #f3f3f8 !important;
        }
        .selection-active .icon-container {
            background-color: #064774 !important;
            color: #ffffff !important;

<body class="bg-background text-on-background font-body-large antialiased min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim h-16 transition-colors duration-200">
<div class="flex items-center justify-between px-container-padding h-full w-full max-w-7xl mx-auto">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-headline-section text-[14px] text-on-surface-variant uppercase tracking-widest">Step 1 of 3</span>
<div class="flex gap-1 mt-1">
<div class="h-1 w-6 rounded-full bg-primary"></div>
<div class="h-1 w-6 rounded-full bg-surface-container-highest"></div>
<div class="h-1 w-6 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="pt-24 pb-32 px-container-padding max-w-2xl mx-auto">
<!-- Hero Section -->
<section class="mb-section-margin text-center md:text-left">
<h1 class="font-display-hero text-[32px] md:text-display-hero text-on-surface mb-4 leading-tight">
                Personalize Your Journey
            </h1>
<p class="text-on-surface-variant font-body-large max-w-md mx-auto md:mx-0">
                Help us tailor your experience by sharing your goals and preferences.
            </p>
</section>
<!-- Section 1: Goals -->
<section class="mb-section-margin">
<h2 class="font-headline-section text-headline-section mb-6">What is your primary goal?</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-grid-gap">
<!-- Goal Card 1 -->
<button class="bento-card-hover flex flex-col items-center justify-center p-6 bg-surface-container-lowest border border-outline-variant rounded-xl text-center group transition-all duration-200" onclick="toggleSelection(this, 'goal')">
<div class="icon-container w-16 h-16 rounded-2xl bg-primary-fixed-dim flex items-center justify-center mb-4 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="trending_down">trending_down</span>
</div>
<span class="font-title-card text-title-card text-on-surface">Weight Loss</span>
</button>
<!-- Goal Card 2 -->
<button class="bento-card-hover flex flex-col items-center justify-center p-6 bg-surface-container-lowest border border-outline-variant rounded-xl text-center group transition-all duration-200" onclick="toggleSelection(this, 'goal')">
<div class="icon-container w-16 h-16 rounded-2xl bg-primary-fixed-dim flex items-center justify-center mb-4 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="fitness_center">fitness_center</span>
</div>
<span class="font-title-card text-title-card text-on-surface">Build Muscle</span>
</button>
<!-- Goal Card 3 -->
<button class="bento-card-hover flex flex-col items-center justify-center p-6 bg-surface-container-lowest border border-outline-variant rounded-xl text-center group transition-all duration-200" onclick="toggleSelection(this, 'goal')">
<div class="icon-container w-16 h-16 rounded-2xl bg-primary-fixed-dim flex items-center justify-center mb-4 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="eco">eco</span>
</div>
<span class="font-title-card text-title-card text-on-surface">Healthy Lifestyle</span>
</button>
</div>
</section>
<!-- Section 2: Dietary Preferences -->
<section class="mb-section-margin">
<h2 class="font-headline-section text-headline-section mb-6">Dietary Preferences</h2>
<div class="flex flex-wrap gap-3">
<!-- Diet Chips -->
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface-container-lowest font-body-large text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="restaurant">restaurant</span>
                    Vegetarian
                </button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface-container-lowest font-body-large text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="grass">grass</span>
                    Vegan
                </button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface-container-lowest font-body-large text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="grain">grain</span>
                    Gluten-Free
                </button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface-container-lowest font-body-large text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="bolt">bolt</span>
                    Keto
                </button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface-container-lowest font-body-large text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="potted_plant">potted_plant</span>
                    Paleo
                </button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface-container-lowest font-body-large text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-[20px]" data-icon="opacity">opacity</span>
                    Dairy-Free
                </button>
</div>
</section>
<!-- Visual Bento Anchor -->
<div class="rounded-xl overflow-hidden relative h-48 mb-8">
<img alt="Healthy ingredients" class="w-full h-full object-cover" data-alt="A beautifully arranged overhead shot of various fresh ingredients including vibrant leafy greens, sliced citrus fruits, nuts, and healthy grains in a clean, high-end kitchen setting. The lighting is soft and natural, emphasizing textures and colors that align with a premium culinary aesthetic. The mood is aspirational and organized, reflecting a sophisticated lifestyle of wellness and fine dining. Soft blue and warm wood tones ground the composition." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxy5bJVHyFnDjNEXTgO7s0DWW3K9z54UVDIPjMR30YXj8TFLYWWXxcS4uGw9SHnGt5d_mvjL4w6fcjVaFvYDzcE5HVq_xlJMDBuLNT493gxYN-dgQvdapmuL40x6t7JixCKDBWJQNRSGT9thNrytCQBfYjSKZe61uyxPy7Uwe_7pq7KgJzS1vRt8RdtU1BAv0ScEBcwgpZspcc9BIz_KSW59oJwssE0le1pNnfL4ju2v7F4asBGjfZCbKXLTSjl7joyFALU8SFRSok"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-6">
<p class="text-white font-title-card">We'll find the perfect recipes for you.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-t border-outline-variant px-4 py-3 pb-safe-area shadow-sm">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-3">
<button class="w-full md:flex-1 py-4 px-6 bg-secondary-container text-on-secondary-container rounded-xl font-headline-section text-[18px] flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-150">
                Continue
                <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full md:w-auto py-4 px-8 text-on-surface-variant font-label-caps uppercase hover:bg-surface-container-high rounded-xl transition-colors order-first md:order-last">
                Skip for now
            </button>
</div>
</footer>
<script>
        function toggleSelection(element, type) {
            if (type === 'goal') {
                const siblings = element.parentElement.querySelectorAll('button');
                siblings.forEach(sib => sib.classList.remove('selection-active'));
                element.classList.add('selection-active');
            }
        }

        function toggleChip(element) {
            element.classList.toggle('bg-primary');
            element.classList.toggle('text-white');
            element.classList.toggle('border-primary');
            
            const icon = element.querySelector('.material-symbols-outlined');
            if (element.classList.contains('bg-primary')) {
                icon.style.fontVariationSettings = "'FILL' 1";
            } else {
                icon.style.fontVariationSettings = "'FILL' 0";
            }
        }
    </script>
</body></html>
